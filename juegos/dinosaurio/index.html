<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinosaurio — Ninrold</title><style>:root{--r:#e12727;--p:#f7f5f0;--i:#111}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial,sans-serif;color:var(--i)}main{width:min(900px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}a{color:inherit}.mark{display:inline-block;width:16px;height:16px;background:var(--r);vertical-align:middle;margin-right:8px}h1{font-size:clamp(50px,12vw,105px);letter-spacing:-.09em;margin:65px 0 8px;line-height:.85}.sub{color:#68645f}.frame{margin-top:34px;background:#202020;padding:12px;box-shadow:10px 10px 0 #111}.game{width:100%;display:block;image-rendering:pixelated;cursor:pointer}.hint{font-size:13px;color:#68645f;margin-top:18px}.hint b{color:var(--r)}</style></head><body><main><header class="top"><a href="../"><i class="mark"></i>Juegos</a><span>03 · Dinosaurio</span></header><h1>DINOSAURIO</h1><p class="sub">Un salto, un objetivo: llega a 500 puntos.</p><div class="frame"><canvas id="game" class="game" width="800" height="260" aria-label="Juego del dinosaurio"></canvas></div><p class="hint"><b>Espacio / ↑ / clic</b> para saltar · al llegar a 500, ganas.</p></main><script>
const c=document.querySelector('#game'),x=c.getContext('2d');let state='ready',d={y:0,v:0,leg:0},obs=[],clouds=[],score=0,last=0,spawn=0,flash=0;
function rect(a,b,w,h,col='#f5f3ee'){x.fillStyle=col;x.fillRect(a,b,w,h)}function text(t,a,b,size=15,col='#f5f3ee'){x.fillStyle=col;x.font='bold '+size+'px monospace';x.fillText(t,a,b)}
function dino(){let base=184-d.y;rect(44,base-33,29,22);rect(63,base-48,22,21);rect(78,base-43,10,9);rect(69,base-43,3,3,'#202020');rect(48,base-11,8,16);rect(65,base-11,8,16);rect(35,base-25,12,8);if(d.leg)rect(58,base+3,8,4);else rect(42,base+3,8,4)}
function cactus(o){let y=184;rect(o.x,y-o.h,12,o.h);rect(o.x-8,y-o.h+16,8,8);rect(o.x-8,y-o.h+8,5,16);rect(o.x+12,y-o.h+25,8,8);rect(o.x+17,y-o.h+17,5,16)}
function ground(){rect(0,185,800,2);for(let i=0;i<30;i++){let a=(i*67+Math.floor(score*3))%800;rect(a,198+(i%3)*6,3,2)}}
function sky(){clouds.forEach(q=>{q.x-=.45;if(q.x<-60)q.x=840;q.s=(q.s||1);rect(q.x,50+q.y,18,2);rect(q.x+7,46+q.y,12,2);rect(q.x+13,49+q.y,18,2)});x.strokeStyle='#f5f3ee';x.lineWidth=1;x.beginPath();x.arc(680,54,16,0,Math.PI*2);x.stroke()}
function draw(){x.clearRect(0,0,800,260);x.fillStyle=state==='lose'?'#281d1d':'#202020';x.fillRect(0,0,800,260);sky();ground();obs.forEach(cactus);dino();text('HI '+String(Math.max(score,45)).padStart(5,'0')+'  '+String(score).padStart(5,'0'),600,30,15);if(state==='ready'){text('DINOSAURIO',310,96,22);text('PRESIONA ESPACIO PARA JUGAR',236,128,13);rect(380,145,40,34,'#e12727');text('↻',390,170,22)}if(state==='lose'){text('GAME OVER',293,95,22);rect(380,115,40,34,'#e12727');text('↻',390,140,22);text('PRESIONA ESPACIO PARA REINTENTAR',220,180,13)}if(state==='win'){text('¡NIVEL SUPERADO!',255,95,21,'#e12727');text('500 PUNTOS',332,126,16);rect(380,145,40,34,'#e12727');text('↻',390,170,22)}if(flash>0){x.fillStyle='rgba(225,39,39,'+(flash/14)+')';x.fillRect(0,0,800,260)}}
function jump(){if(state==='ready'||state==='lose'||state==='win'){start();return}if(d.y===0)d.v=15}
function start(){state='play';score=0;obs=[];d={y:0,v:0,leg:0};spawn=0;flash=0;last=0;requestAnimationFrame(loop)}
function loop(t){if(state!=='play'){draw();return}let dt=Math.min(32,t-last||16);last=t;d.v-=.9;d.y=Math.max(0,d.y+d.v);if(d.y===0&&d.v<0)d.v=0;d.leg=Math.floor(t/80)%2;spawn+=dt;let speed=5+score/140;if(spawn>950-Math.min(score,400)){obs.push({x:820,h:34+Math.floor(Math.random()*34)});spawn=0}obs.forEach(o=>o.x-=speed);obs=obs.filter(o=>o.x>-35);if(obs.some(o=>o.x<74&&o.x+22>45&&d.y<42)){state='lose';flash=14}score++;if(score>=500){state='win';flash=14}if(flash)flash--;draw();if(state==='play')requestAnimationFrame(loop)}
clouds=[{x:130,y:0},{x:430,y:32},{x:740,y:4}];draw();document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});c.addEventListener('click',jump);
</script></body></html>
