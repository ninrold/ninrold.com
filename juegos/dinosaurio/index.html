<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dinosaurio — Ninrold</title><style>:root{--r:#d92525;--i:#111;--p:#f7f5f0;--m:#68645f}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial,sans-serif;color:var(--i)}main{width:min(900px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}a{color:inherit}.mark{display:inline-block;width:16px;height:16px;background:var(--r);vertical-align:middle;margin-right:8px}h1{font-size:clamp(50px,12vw,105px);letter-spacing:-.09em;margin:65px 0 8px;line-height:.85}.sub{color:var(--m)}.game{position:relative;margin-top:38px;border:1px solid var(--i);height:280px;overflow:hidden;background:#fff}.ground{position:absolute;bottom:42px;width:100%;border-top:2px solid}.dino{position:absolute;bottom:44px;left:12%;width:34px;height:55px;background:var(--i)}.dino:after{content:'';position:absolute;top:-13px;left:12px;width:30px;height:25px;background:var(--i)}.cactus{position:absolute;bottom:44px;width:19px;height:50px;background:var(--r)}.cactus:after{content:'';position:absolute;width:34px;height:9px;background:var(--r);top:20px;left:-8px}.hud{position:absolute;top:15px;left:18px;font-size:14px}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(247,245,240,.82);text-align:center;font-weight:bold}.overlay button{margin-top:12px;background:var(--r);color:#fff;border:0;padding:11px 16px;font-weight:bold;cursor:pointer}.hint{font-size:13px;color:var(--m);margin-top:15px}</style></head><body><main><header class="top"><a href="../"><i class="mark"></i>Juegos</a><span>03 · Dinosaurio</span></header><h1>DINOSAURIO</h1><p class="sub">Salta los obstáculos con Espacio, ↑ o tocando el juego.</p><div class="game" id="game"><div class="hud">Puntos: <b id="score">0</b></div><div class="ground"></div><div class="dino" id="dino"></div><div class="overlay" id="overlay"><div>¿Una partida rápida?<br><button id="start">Jugar</button></div></div></div><p class="hint">Cada partida acelera poco a poco.</p></main><script>const game=document.querySelector('#game'),d=document.querySelector('#dino'),o=document.querySelector('#overlay'),s=document.querySelector('#score');let run=false,y=0,vy=0,obs=[],points=0,last=0,spawn=0;function jump(){if(run&&y===0)vy=15}function end(){run=false;o.innerHTML='<div>Fin · '+points+' puntos<br><button id="start">Otra vez</button></div>';o.style.display='grid';document.querySelector('#start').onclick=start}function tick(t){if(!run)return;let dt=Math.min(32,t-last||16);last=t;vy-=.9;y=Math.max(0,y+vy);if(y===0&&vy<0)vy=0;d.style.transform='translateY('+(-y)+'px)';spawn+=dt;if(spawn>1100-Math.min(points*3,600)){let c=document.createElement('i');c.className='cactus';c.style.left='100%';game.append(c);obs.push({e:c,x:game.clientWidth});spawn=0}let speed=5+points/150;obs.forEach(q=>{q.x-=speed;q.e.style.left=q.x+'px';if(q.x<game.clientWidth*.12+34&&q.x+19>game.clientWidth*.12&&y<48)end();if(q.x<-30){q.e.remove();obs.splice(obs.indexOf(q),1)}});points++;s.textContent=points;requestAnimationFrame(tick)}function start(){obs.forEach(q=>q.e.remove());obs=[];points=0;y=0;vy=0;spawn=0;run=true;o.style.display='none';last=0;requestAnimationFrame(tick)}document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump()}});game.onclick=jump;document.querySelector('#start').onclick=start</script></body></html>
