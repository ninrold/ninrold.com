<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deslizante — Ninrold</title><style>:root{--r:#d92525;--i:#111;--p:#f7f5f0;--m:#68645f}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial,sans-serif;color:var(--i)}main{width:min(720px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}a{color:inherit}.mark{display:inline-block;width:16px;height:16px;background:var(--r);vertical-align:middle;margin-right:8px}h1{font-size:clamp(50px,12vw,105px);letter-spacing:-.09em;margin:65px 0 8px;line-height:.85}.sub{color:var(--m)}.bar{display:flex;justify-content:space-between;align-items:center;margin:35px 0 14px;font-size:14px}.btn{background:var(--r);color:white;border:0;padding:11px 15px;font-weight:bold;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;aspect-ratio:1;background:#111;padding:5px}.tile{border:0;background:#f7f5f0;color:#111;font-size:clamp(26px,8vw,50px);font-weight:bold;cursor:pointer;transition:.15s}.tile:hover{background:#e4dfd6}.empty{background:var(--r);cursor:default}.message{min-height:24px;margin-top:15px;color:var(--r);font-weight:bold}.board.win{animation:winPulse .65s ease 3}@keyframes winPulse{50%{transform:scale(1.025);box-shadow:0 0 0 7px #e12727}}.celebrate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(17,17,17,.82);opacity:0;pointer-events:none;transition:.25s;z-index:5}.celebrate.show{opacity:1;pointer-events:auto}.celebrate div{background:#f7f5f0;border:7px solid #e12727;padding:35px;text-align:center;font-weight:bold;font-size:24px;animation:pop .45s both}@keyframes pop{from{transform:scale(.5) rotate(-4deg)}to{transform:scale(1) rotate(0)}}.celebrate small{display:block;margin-top:10px;color:#68645f;font-size:14px}</style></head><body><main><header class="top"><a href="../"><i class="mark"></i>Juegos</a><span>02 · Deslizante</span></header><h1>DESLIZANTE</h1><p class="sub">Ordena las piezas del 1 al 15. Usa los números junto al espacio rojo.</p><div class="bar"><span>Movimientos: <b id="moves">0</b></span><button class="btn" id="new">Mezclar</button></div><div class="board" id="board" aria-label="Puzzle deslizante"></div><div class="message" id="message" role="status"></div><div id="celebrate" class="celebrate" aria-live="assertive"><div>¡RESUELTO!<small id="winText"></small></div></div></main><script>let a=[],moves=0;const b=document.querySelector('#board'),m=document.querySelector('#moves'),msg=document.querySelector('#message'),celebrate=document.querySelector('#celebrate'),winText=document.querySelector('#winText');function solvable(x){let n=0;for(let i=0;i<16;i++)for(let j=i+1;j<16;j++)if(x[i]&&x[j]&&x[i]>x[j])n++;let row=4-Math.floor(x.indexOf(0)/4);return (n+row)%2===1}function draw(){b.innerHTML='';a.forEach((v,i)=>{let x=document.createElement('button');x.className='tile'+(!v?' empty':'');x.textContent=v||'';x.disabled=!v;x.onclick=()=>move(i);b.append(x)})}function move(i){let z=a.indexOf(0),r=Math.abs(Math.floor(i/4)-Math.floor(z/4))+Math.abs(i%4-z%4);if(r!==1)return;[a[i],a[z]]=[a[z],a[i]];moves++;m.textContent=moves;draw();if(a.every((v,i)=>v===(i+1)%16)){msg.textContent='¡Resuelto en '+moves+' movimientos!';b.classList.add('win');winText.textContent=moves+' movimientos';celebrate.classList.add('show');setTimeout(()=>celebrate.classList.remove('show'),2200)}}function start(){do{a=[...Array(15)].map((_,i)=>i+1).concat(0).sort(()=>Math.random()-.5)}while(!solvable(a)||a.every((v,i)=>v===(i+1)%16));moves=0;m.textContent=0;msg.textContent='';b.classList.remove('win');draw()}document.querySelector('#new').onclick=start;start()</script></body></html>
