<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deslizante — Ninrold</title><style>:root{--r:#d92525;--i:#111;--p:#f7f5f0;--m:#68645f}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial,sans-serif;color:var(--i)}main{width:min(720px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}a{color:inherit}.mark{display:inline-block;width:16px;height:16px;background:var(--r);vertical-align:middle;margin-right:8px}h1{font-size:clamp(50px,12vw,105px);letter-spacing:-.09em;margin:65px 0 8px;line-height:.85}.sub{color:var(--m)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:35px 0 14px;font-size:14px}.bar>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{background:var(--r);color:white;border:0;padding:11px 15px;font-weight:bold;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;aspect-ratio:1;background:#111;padding:5px}.tile{border:0;background:#f7f5f0;color:#111;font-size:clamp(18px,8vw,50px);font-weight:bold;cursor:pointer;transition:.15s;min-width:0;aspect-ratio:1}.tile:hover{background:#e4dfd6}.empty{background:var(--r);cursor:default}.message{min-height:24px;margin-top:15px;color:var(--r);font-weight:bold}.board.win{animation:winPulse .65s ease 3}@keyframes winPulse{50%{transform:scale(1.025);box-shadow:0 0 0 7px #e12727}}.celebrate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(17,17,17,.82);opacity:0;pointer-events:none;transition:.25s;z-index:5}.celebrate.show{opacity:1;pointer-events:auto}.celebrate div{background:#f7f5f0;border:7px solid #e12727;padding:35px;text-align:center;font-weight:bold;font-size:24px;animation:pop .45s both}@keyframes pop{from{transform:scale(.5) rotate(-4deg)}to{transform:scale(1) rotate(0)}}.celebrate small{display:block;margin-top:10px;color:#68645f;font-size:14px}</style></head><body><main><header class="top"><a href="../"><i class="mark"></i>Juegos</a><span>02 · Deslizante</span></header><h1>DESLIZANTE</h1><p class="sub">Ordena las piezas del 1 al 15. Usa los números junto al espacio rojo.</p><div class="bar"><span>Movimientos: <b id="moves">0</b></span><div><label for="size" style="margin-right:8px">Cuadrícula:</label><select id="size" style="padding:10px;border:1px solid #111;background:#f7f5f0;font-weight:bold"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option></select><button class="btn" id="new">Mezclar</button></div></div><div class="board" id="board" aria-label="Puzzle deslizante"></div><div class="message" id="message" role="status"></div><div id="celebrate" class="celebrate" aria-live="assertive"><div>¡RESUELTO!<small id="winText"></small></div></div></main><script>
let a=[],moves=0,size=4;
const b=document.querySelector('#board'),m=document.querySelector('#moves'),msg=document.querySelector('#message'),celebrate=document.querySelector('#celebrate'),winText=document.querySelector('#winText'),sizeSelect=document.querySelector('#size');
function solvable(x){
  let inversions=0;
  for(let i=0;i<x.length;i++) for(let j=i+1;j<x.length;j++) if(x[i]&&x[j]&&x[i]>x[j]) inversions++;
  if(size%2===1) return inversions%2===0;
  const rowFromBottom=size-Math.floor(x.indexOf(0)/size);
  return (inversions+rowFromBottom)%2===1;
}
function solved(){return a.every((v,i)=>v===(i+1)%(size*size));}
function draw(){
  b.style.gridTemplateColumns=`repeat(${size},1fr)`;
  b.style.gap=size>=6?'3px':'5px';
  b.style.padding=size>=6?'3px':'5px';
  b.innerHTML='';
  a.forEach((v,i)=>{
    const x=document.createElement('button');
    x.className='tile'+(!v?' empty':'');
    x.textContent=v||'';x.disabled=!v;x.setAttribute('aria-label',v?`Ficha ${v}`:'Espacio vacío');x.onclick=()=>move(i);b.append(x);
  });
}
function move(i){
  const z=a.indexOf(0);
  const r=Math.abs(Math.floor(i/size)-Math.floor(z/size))+Math.abs(i%size-z%size);
  if(r!==1)return;
  [a[i],a[z]]=[a[z],a[i]];moves++;m.textContent=moves;draw();
  if(solved()){
    msg.textContent='¡Resuelto en '+moves+' movimientos!';b.classList.add('win');winText.textContent=moves+' movimientos · '+size+' × '+size;celebrate.classList.add('show');
    setTimeout(()=>celebrate.classList.remove('show'),2200);
  }
}
function start(){
  const total=size*size;
  do{
    a=[...Array(total-1)].map((_,i)=>i+1).concat(0).sort(()=>Math.random()-.5);
  }while(!solvable(a)||solved());
  moves=0;m.textContent=0;msg.textContent='';b.classList.remove('win');draw();
}
sizeSelect.addEventListener('change',()=>{size=Number(sizeSelect.value);start()});
document.querySelector('#new').onclick=start;start();
</script></body></html>
