<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juegos — Ninrold</title><style>:root{--r:#d92525;--i:#111;--p:#f7f5f0;--l:#d9d5cd;--m:#68645f}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial,sans-serif;color:var(--i)}main{max-width:1180px;margin:auto;padding:24px}a{color:inherit}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--i);padding-bottom:16px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}.mark{display:inline-block;width:16px;height:16px;background:var(--r);vertical-align:middle;margin-right:8px}h1{font-size:clamp(58px,13vw,170px);letter-spacing:-.09em;line-height:.82;margin:clamp(65px,12vh,130px) 0 28px}.lead{max-width:500px;line-height:1.6;color:var(--m);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:55px}.game{position:relative;min-height:280px;border:1px solid var(--i);padding:20px;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:.2s}.game:hover{background:var(--i);color:var(--p);transform:translateY(-3px)}.game b{font-size:28px;letter-spacing:-.05em}.num{color:var(--r);font-size:12px;letter-spacing:.1em}.shape{position:absolute;right:-22px;bottom:-32px;width:145px;height:145px;border:18px solid var(--r);border-radius:50%;opacity:.95}.slide .shape{border-radius:0;width:128px;height:128px;transform:rotate(45deg)}.run .shape{border-width:0;width:120px;height:40px;bottom:42px;border-radius:0;background:var(--r)}.run .shape:after{content:"";position:absolute;right:25px;top:-60px;width:44px;height:73px;background:var(--r)}small{color:var(--m)}@media(max-width:700px){.grid{grid-template-columns:1fr}.game{min-height:180px}}</style></head><body><main><header class="top"><a href="../"><i class="mark"></i>Ninrold</a><span>Juegos</span></header><h1>JUEGOS</h1><p class="lead">Pequeñas pausas para despejar la mente. La colección crecerá sin interrumpir el resto del sitio.</p><section class="grid"><a class="game" href="sudoku/"><span class="num">01 · LÓGICA</span><b>Sudoku</b><small>Completa el tablero.</small><i class="shape"></i></a><a class="game slide" href="deslizante/"><span class="num">02 · ORDEN</span><b>Deslizante</b><small>Ordena los números.</small><i class="shape"></i></a><a class="game run" href="dinosaurio/"><span class="num">03 · REFLEJOS</span><b>Dinosaurio</b><small>Salta los obstáculos.</small><i class="shape"></i></a></section></main></body></html>
